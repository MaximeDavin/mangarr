name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the Bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun x biome ci .
